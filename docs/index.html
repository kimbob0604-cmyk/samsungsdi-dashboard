*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
a{color:inherit}button,select,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:10px 32px;background:var(--head-bg);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px)}
.brand{font-weight:800;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--up),#f59e0b 55%,var(--accent))}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:999px;white-space:nowrap;color:var(--sub);text-decoration:none;cursor:pointer;border:0;background:none;min-height:34px}
.tab:hover{background:var(--chip);color:var(--text)}.tab.on{background:var(--text);color:var(--card);font-weight:600}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer}
main{max-width:1240px;margin:0 auto;padding:18px 32px 40px}
.page{display:none}.page.on{display:block}
.page-head{margin:6px 2px 14px}.page-head h1{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700}.cap{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{background:var(--hover)}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em}.kpi .s{font-size:12px;color:var(--sub)}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--sub);white-space:nowrap;min-height:32px}
.seg button.on{background:var(--chip-on);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dir{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer;min-height:34px;font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}

.wc .ch{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px;background:rgba(255,255,255,.92);color:#191f28}
.wc .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}

.wc .g{font-size:11px;color:var(--muted)}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.ch-box{position:relative;height:280px}.ch-box.tall{height:340px}

.fin-in label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}

.ct input{max-width:110px;text-align:right}td.d{color:var(--muted);font-size:12px;white-space:normal;min-width:180px}

<style>

.pill.wait{background:rgba(245,158,11,.16);color:#b7791f}.pill.ok{background:rgba(20,163,154,.14);color:var(--c3)}.pill.dream{background:rgba(155,107,211,.16);color:var(--c4)}

.flow .b .h{font-size:12px;color:var(--muted)}.flow .b .v{font-size:20px;font-weight:800}.flow .b .x{font-size:12px;color:var(--sub)}

 H+=`<section class="page" id="src"><div class="page-head"><h1>출처</h1></div>${card('','',`<ul class="def"><li>DART 삼성SDI 분기·사업보고서, 주요사항보고서(유상증자 2025.03.14, 삼성디스플레이 지분 양도 2026.08.21), 투자판단관련(GM JV 종료 2026.08.11, 미국 공급계약 2026.01.30), 장래사업계획(2026.07.02~03)</li><li>중국 배제: Utility Dive(2026.8·9, BNEF), POWER Magazine(EO 14421), Rystad Energy, Hunton, pv magazine(2026.6.10), ESS News(2026.8.27), Foley Hoag(2026.7), IRS Notice 2026-15, Fluence 10-K·AES 10-Q·Energy Vault 10-Q(SEC), SCMP, 그린포스트코리아, 코리아중앙데일리·머니투데이(2026.11.16)</li><li>KUVIC 리서치 2팀 「ESSential」(2026.09.14): 미국 ESS 수요, 중국 채택률, 45X·48E 원가, 3사 비교</li><li>S.R.S SOKHA 리서치팀 「삼성ESS, The Ideal Pick」(2026.11.10): 산업·ESS·UPS·BBU·전고체 추정과 SOTP</li><li>리포트: 교보(11/20)·SK·유안타·대신·하나(10/30) · 기사로 확인: 신한(11/4 이투데이, 10/30 브릿지경제, 10/14 파이낸셜포스트), DS(10/8)·iM(9/21) 파이낸셜뉴스, 삼성(9/28 아주경제)</li><li>주가·피어: Yahoo Finance(11/24)</li></ul>`)}</section>`;
 $('#main').innerHTML=H;
 $('#foot').textContent='리서치 정리 · 투자 권유 아님';
 $('#stamp').textContent='기준 2026-11-24';
 ['vN','vP'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();
}
function calc(){const v=+$('#vN').value*+$('#vP').value+SOTP.nonop-SOTP.nd-SOTP.nci-SOTP.pref;$('#vOut').textContent=nf(v,1)+'조';const a=v-MC;$('#vUp').innerHTML=`지금 대비 <span class="${cls(a)}">${a>0?'+':''}${nf(a,1)}조 (${pc(a/MC*100)})</span>`}
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;const old=Chart.getChart(el);if(old)old.destroy();Chart.defaults.color=css('--sub');Chart.defaults.borderColor=css('--grid');Chart.defaults.font.family='Pretendard Variable, Pretendard, sans-serif';new Chart(el,cfg)}
function draw(h){
 const c1=css('--c1'),c2=css('--c2'),c3=css('--c3'),c4=css('--c4'),c5=css('--c5'),c6=css('--c6');
 const O={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}};
 const noL={...O,plugins:{legend:{display:false}}};
 if(h==='fin'){
  mk('cQ',{data:{labels:Q.map(r=>r.q),datasets:[{type:'bar',label:'매출(억)',data:Q.map(r=>r.rev),backgroundColor:c1+'aa',yAxisID:'y'},{type:'bar',label:'영업이익(억)',data:Q.map(r=>r.op),backgroundColor:Q.map(r=>r.op<0?css('--down'):c2),yAxisID:'y1'},{type:'line',label:'OPM(%)',data:Q.map(r=>+(r.op/r.rev*100).toFixed(1)),borderColor:c5,yAxisID:'y2',tension:.3}]},options:{...O,scales:{y:{beginAtZero:true},y1:{display:false},y2:{position:'right',grid:{display:false},ticks:{callback:v=>v+'%'}}}}});
  mk('cY',{data:{labels:Y.map(r=>r.y),datasets:[{type:'bar',label:'영업이익 AMPC 포함(억)',data:Y.map(r=>r.op),backgroundColor:Y.map(r=>r.op<0?css('--down'):r.e?c1+'88':c1)},{type:'line',label:'AMPC 외 영업이익',data:Y.map(r=>r.ex??null),borderColor:c5,borderDash:[5,4],spanGaps:true},{type:'line',label:'증권사 평균',data:Y.map(r=>r.c??null),borderColor:c3,showLine:false,pointRadius:6,pointStyle:'rectRot'}]},options:O});
 }
 if(h==='ess'){
  mk('cCapa',{type:'bar',data:{labels:CAPA.y,datasets:[{label:'미국 ESS CAPA',data:CAPA.v,backgroundColor:CAPA.y.map(y=>y.includes('E')?c3+'99':c3)},{type:'line',label:'미국 판매량',data:ESS.q,borderColor:c2}]},options:O});
  mk('cEss',{type:'bar',data:{labels:ESS.y,datasets:[{label:'미국 생산',data:ESS.us,backgroundColor:c1},{label:'미국 외',data:ESS.nus,backgroundColor:c6+'99'}]},options:{...O,scales:{x:{stacked:true},y:{stacked:true}}}});
 }
 if(h==='china') mk('cCn',{type:'bar',data:{labels:['2026','2027E','2028E','2029E'],datasets:[{label:'중국 셀 채택률(%)',data:[71.2,39.8,3.9,0],backgroundColor:[css('--up'),css('--up')+'bb',css('--up')+'77',css('--up')+'44']}]},options:{...noL,scales:{y:{max:100,ticks:{callback:v=>v+'%'}}}}});
 if(h==='ups') mk('cUB',{type:'bar',data:{labels:UB.y,datasets:[{label:'UPS',data:UB.ups,backgroundColor:c1},{label:'BBU',data:UB.bbu,backgroundColor:c2}]},options:{...O,scales:{x:{stacked:true},y:{stacked:true}}}});
 if(h==='ampc') mk('cAm',{type:'bar',data:{labels:AMPCY.y,datasets:[{label:'AMPC',data:AMPCY.a,backgroundColor:c1},{label:'그 외 영업이익',data:AMPCY.o,backgroundColor:c6+'99'}]},options:{...O,scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+' '+nf(c.raw,2)+'조'}}}}});
 if(h==='val'){const L=['하방','지금','보수(순이익×24)','증권사 평균','목표 10.7배','Bull 12.8배'],V=[SC.down,MC,SC.c24,SC.broker,SC.tgt,SC.skBull];mk('cV',{type:'bar',data:{labels:L,datasets:[{data:V,backgroundColor:[css('--down'),c6,c3,c2,c1,c4]}]},options:{...noL,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>nf(c.raw,1)+'조 ('+fa(add(c.raw))+')'}}}}})}
 if(h==='px'){
  mk('cP',{type:'line',data:{labels:P.d,datasets:[{label:'삼성SDI',data:P['삼성SDI'],borderColor:c1,pointRadius:0,borderWidth:1.6,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}}}}});
  const base=a=>{const f=a.find(x=>x!=null);return a.map(x=>x==null?null:+(x/f*100).toFixed(1))};
  const cs=[c1,c2,c3,c4,c5,c6];
  mk('cR',{type:'line',data:{labels:P.d,datasets:['삼성SDI','LG에너지솔루션','SK이노베이션','CATL','파나소닉','포스코퓨처엠'].map((n,i)=>({label:n,data:base(P[n]),borderColor:cs[i],pointRadius:0,borderWidth:n==='삼성SDI'?2.4:1.2,spanGaps:true}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}},scales:{x:{ticks:{maxTicksLimit:8}}}}});
 }
}
$('#theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';nav()};
build();window.addEventListener('hashchange',nav);nav();
